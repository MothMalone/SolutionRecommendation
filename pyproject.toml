[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-aco"
version = "0.1.0"
description = "AutoML pipeline recommendation with ACO and meta-learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Auto-generated"}]

dependencies = [
  "numpy<2",
  "pandas<3",
  "scikit-learn<1.6",
  "scipy<1.13",
]

[project.optional-dependencies]
full = [
  "torch",
  "autogluon.tabular",
  "xgboost",
  "category_encoders",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
